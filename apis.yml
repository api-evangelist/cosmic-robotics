aid: cosmic-robotics
name: Cosmic Robotics
description: >-
  Cosmic Robotics, Inc. designs and operates autonomous construction equipment
  that takes on the hardest, most dangerous jobs on a construction site,
  coordinated as a fleet by a single software layer. Its first market is
  utility-scale solar energy, with expansion planned into data center
  construction. The flagship Cosmic-1A is a purpose-built robotic platform for
  solar panel installation, and Constellation is the coordination and control
  layer that plans, dispatches, and monitors the robot fleet across a jobsite.
  Founded in 2023 and based in the Dogpatch neighborhood of San Francisco, the
  company is backed by Y Combinator. Cosmic Robotics is currently a hardware and
  fleet-software company with no public developer API; this profile tracks its
  identity and any agent-facing surfaces (such as its published llms.txt) as the
  API Evangelist network enrichment pipeline monitors it for a future API.
